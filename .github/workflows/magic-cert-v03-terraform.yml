name: Terraform

on:
  pull_request:
    paths:
      - "Magic_Cert_v03/**"
      - ".github/workflows/magic-cert-v03-terraform.yml"
  push:
    branches: [master, main]
    paths:
      - "Magic_Cert_v03/**"
      - ".github/workflows/magic-cert-v03-terraform.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: Magic_Cert_v03/terraform
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: magic-cert-terraform-locks

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=v03/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config="encrypt=true"
      - run: terraform -chdir="$TF_DIR" fmt -check -recursive
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" plan -no-color

  apply:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=v03/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config="encrypt=true"
      - run: terraform -chdir="$TF_DIR" fmt -check -recursive
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" apply -auto-approve
      - name: Build and deploy frontend
        working-directory: Magic_Cert_v03/frontend
        run: |
          API_URL="$(terraform -chdir="../../Magic_Cert_v03/terraform" output -raw api_gateway_url)"
          printf 'VITE_API_URL=%s\n' "$API_URL" > .env.production
          npm ci
          npm run build
          BUCKET_NAME="$(terraform -chdir="../../Magic_Cert_v03/terraform" output -raw website_bucket_name)"
          aws s3 sync dist/ "s3://$BUCKET_NAME" --delete
