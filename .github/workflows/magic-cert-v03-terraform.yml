name: GitHub Actions con CI/CD

on:
  pull_request:
    paths:
      - "Magic_Cert_v03/**"
      - ".github/workflows/magic-cert-v03-terraform.yml"
  push:
    branches: [master, main]
    paths:
      - "Magic_Cert_v03/**"
      - ".github/workflows/magic-cert-v03-terraform.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: Magic_Cert_v03/terraform
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: v03/sebas/terraform.tfstate
  TF_WORKSPACE: sebas-v3
  TF_VAR_deployment_id: sebas
  TF_VAR_custom_domain_name: magic.cert.glaciar.org
  TF_VAR_additional_domain_names: '["magico.cert.glaciar.org"]'
  TF_VAR_hosted_zone_name: cert.glaciar.org
  TF_VAR_bedrock_role_arn: ""
  TF_VAR_bedrock_role_external_id: ""
  TF_VAR_bedrock_region: us-east-1
  TF_VAR_bedrock_model_id: global.amazon.nova-2-lite-v1:0
  TF_VAR_ai_daily_quota_per_user: "6"
  TF_VAR_api_throttling_rate_limit: "10"
  TF_VAR_api_throttling_burst_limit: "20"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
      - run: terraform -chdir="$TF_DIR" workspace select "$TF_WORKSPACE" || terraform -chdir="$TF_DIR" workspace new "$TF_WORKSPACE"
      - run: terraform -chdir="$TF_DIR" fmt -check -recursive
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" plan -no-color

  apply:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
      - run: terraform -chdir="$TF_DIR" workspace select "$TF_WORKSPACE" || terraform -chdir="$TF_DIR" workspace new "$TF_WORKSPACE"
      - run: terraform -chdir="$TF_DIR" fmt -check -recursive
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" apply -auto-approve
      - name: Build and deploy frontend
        working-directory: Magic_Cert_v03/frontend
        run: |
          API_URL="$(terraform -chdir="../../Magic_Cert_v03/terraform" output -raw api_gateway_url)"
          printf 'VITE_API_URL=%s\n' "$API_URL" > .env.production
          npm ci
          npm run build
          BUCKET_NAME="$(terraform -chdir="../../Magic_Cert_v03/terraform" output -raw website_bucket_name)"
          aws s3 sync dist/ "s3://$BUCKET_NAME" --delete
